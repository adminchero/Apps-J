<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colección Numismática · Perú</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0906;--bg2:#111009;--bg3:#19160f;--bg4:#221e15;
  --border:#2a2519;--border2:#3e3828;
  --gold:#d4a930;--gold2:#f0cc60;--gold3:#ffe99a;--gold-dim:#7a6020;
  --goldglow:rgba(212,169,48,0.35);
  --cream:#f0e6cc;--cream2:#d8cbb0;
  --text:#d0c5a8;--text2:#8c8068;--text3:#564e3a;
  --nueva:#2ef890;--nueva-bg:#021a0e;--nueva-border:#0d5c30;--nueva-glow:rgba(46,248,144,0.25);
  --seminueva:#38b8ff;--seminueva-bg:#021424;--seminueva-border:#0a4880;--seminueva-glow:rgba(56,184,255,0.25);
  --conservada:#ffca28;--conservada-bg:#180e00;--conservada-border:#6a4e00;--conservada-glow:rgba(255,202,40,0.25);
  --referencia:#9e9688;--referencia-bg:#161412;--referencia-border:#4a4438;--referencia-glow:rgba(158,150,136,0.2);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;font-size:19px;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:9000}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:3px}

/* HEADER */
.header{padding:38px 40px 28px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#1a1508 0%,transparent 100%);position:relative;overflow:hidden}
.header::after{content:'';position:absolute;top:-60px;left:-60px;width:320px;height:320px;background:radial-gradient(circle,rgba(212,169,48,0.10) 0%,transparent 70%);pointer-events:none}
.header::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);opacity:0.5}
.header-inner{max-width:1440px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}

/* BRAND — sin moneda, solo texto con ornamento SVG fino */
.brand{display:flex;align-items:center;gap:16px}
.brand-icon{width:48px;height:48px;flex-shrink:0;opacity:.85}
.brand-text h1{font-family:'Playfair Display',serif;font-size:27px;font-weight:700;color:var(--gold2);letter-spacing:.01em;text-shadow:0 0 40px rgba(240,204,96,.4)}
.brand-text p{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:.18em;text-transform:uppercase;margin-top:4px}

.stats-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat-pill{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--bg2);transition:all 0.25s ease;position:relative;overflow:hidden}
.stat-pill::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 60%,rgba(255,255,255,.03));pointer-events:none}
.stat-pill:hover{background:var(--bg3);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.stat-pill.total-pill{border-color:var(--border2);background:var(--bg2)}
.stat-pill.total-pill .sdot{background:var(--gold-dim)}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.slabel{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.scount{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:var(--text2)}
.scount.has-items{font-family:'Playfair Display',serif;font-size:20px;font-weight:700}
.sof{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3)}

.top-actions{display:flex;gap:10px;align-items:center;margin-top:14px}
.abtn{font-family:'DM Mono',monospace;font-size:12px;padding:9px 18px;border-radius:6px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:all 0.22s ease;position:relative;overflow:hidden}
.abtn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 60%,rgba(255,255,255,.04))}
.abtn:hover{color:var(--cream);border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.abtn:active{transform:translateY(0);transition-duration:.08s}
.abtn.gold{border-color:var(--gold-dim);color:var(--gold2);background:rgba(212,169,48,.08)}
.abtn.gold:hover{background:rgba(212,169,48,.18);box-shadow:0 4px 20px rgba(212,169,48,.25)}

/* TOOLBAR */
.toolbar{max-width:1440px;margin:0 auto;padding:18px 40px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.filter-group{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:5px}
.fbtn{font-family:'DM Mono',monospace;font-size:11px;padding:7px 14px;border:none;border-radius:6px;cursor:pointer;transition:all 0.2s ease;text-transform:uppercase;letter-spacing:.08em;background:transparent;color:var(--text2)}
.fbtn:hover{color:var(--cream);background:var(--bg4);transform:translateY(-1px)}
.fbtn.active{background:var(--gold2);color:#111;font-weight:600;box-shadow:0 0 14px rgba(240,204,96,.35)}
.search-box{flex:1;min-width:220px;position:relative}
.search-box input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 16px 10px 42px;color:var(--cream);font-family:'Crimson Pro',serif;font-size:17px;outline:none;transition:border-color 0.2s, box-shadow 0.2s}
.search-box input:focus{border-color:var(--gold-dim);box-shadow:0 0 12px rgba(212,169,48,.15)}
.search-box input::placeholder{color:var(--text3)}
.sico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}
.clear-search{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0 6px;border-radius:20px;transition:all 0.2s}
.clear-search:hover{color:var(--cream);background:var(--bg4)}
.progress-wrap{display:flex;align-items:center;gap:12px;margin-left:auto}
.prog-bar{width:160px;height:5px;background:var(--bg4);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold2));border-radius:4px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
.prog-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);white-space:nowrap}

/* MAIN */
.main{max-width:1440px;margin:0 auto;padding:24px 40px 80px}

/* SERIE */
.serie-block{margin-bottom:28px;border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color 0.3s ease, box-shadow 0.3s ease}
.serie-block:hover{border-color:var(--border2);box-shadow:0 2px 24px rgba(0,0,0,.4)}
.serie-block.hidden{display:none}
.serie-hdr{display:flex;align-items:center;gap:14px;padding:16px 24px;background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);cursor:pointer;user-select:none;border-bottom:1px solid var(--border);transition:background 0.2s}
.serie-hdr:hover{background:linear-gradient(135deg,var(--bg3) 0%,var(--bg4) 100%)}
.serie-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold-dim);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;min-width:56px}
.serie-info{flex:1}
.serie-name{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:var(--cream);line-height:1.2}
.serie-meta{display:flex;gap:18px;margin-top:5px;flex-wrap:wrap;align-items:center}
.serie-meta span{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.serie-meta .hl{color:var(--gold)}
.serie-meta .note{font-family:'Crimson Pro',serif;font-size:15px;color:var(--text2);font-style:italic;text-transform:none;letter-spacing:0}
.mini-prog{display:flex;align-items:center;gap:10px}
.mini-bar{width:80px;height:4px;background:var(--bg4);border-radius:3px;overflow:hidden}
.mini-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold2));border-radius:3px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
.mini-pct{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);min-width:34px;text-align:right}
.stoggle{color:var(--text3);font-size:14px;transition:transform 0.35s cubic-bezier(0.4,0,0.2,1)}
.serie-block.collapsed .stoggle{transform:rotate(-90deg)}

/* GRID: las celdas vacías toman el mismo fondo que las cards */
.coins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:0;background:var(--bg)}
.serie-block.collapsed .coins-grid{display:none}

/* COIN CARD */
.coin-card{background:var(--bg);padding:20px 22px 18px;transition:background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;position:relative;cursor:pointer;border:1px solid var(--border);overflow:hidden}
/* quitar doble borde interno en el grid */
.coins-grid .coin-card{border-right:1px solid var(--border);border-bottom:1px solid var(--border);border-left:none;border-top:none}
.coins-grid .coin-card:first-child{border-left:none}
.coin-card::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.025),transparent);transition:left 0.5s ease;pointer-events:none}
.coin-card:hover::before{left:150%}
.coin-card:hover{background:var(--bg2);z-index:1}
.coin-card.has-nueva:hover{box-shadow:inset 0 0 0 1px var(--nueva-border),0 0 20px var(--nueva-glow)}
.coin-card.has-seminueva:hover{box-shadow:inset 0 0 0 1px var(--seminueva-border),0 0 20px var(--seminueva-glow)}
.coin-card.has-conservada:hover{box-shadow:inset 0 0 0 1px var(--conservada-border),0 0 20px var(--conservada-glow)}
.coin-card.has-referencia:hover{box-shadow:inset 0 0 0 1px var(--referencia-border),0 0 20px var(--referencia-glow)}

.coin-idx{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:.05em;margin-bottom:4px}
.coin-year{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold-dim);letter-spacing:.05em}
.coin-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--cream2);line-height:1.3;margin:4px 0 4px}
.coin-region{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.coin-blurb{font-size:14.5px;color:var(--text2);font-style:italic;line-height:1.5;margin-bottom:12px}
.badges-strip{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:22px}
.cbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase}
.cbadge .bdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.cbadge .bcount{background:rgba(255,255,255,.12);border-radius:4px;padding:0 5px;font-size:11px;font-weight:600}
.badge-nueva{background:var(--nueva-bg);border:1px solid var(--nueva-border);color:var(--nueva);box-shadow:0 0 8px rgba(46,248,144,.12)}
.badge-seminueva{background:var(--seminueva-bg);border:1px solid var(--seminueva-border);color:var(--seminueva);box-shadow:0 0 8px rgba(56,184,255,.12)}
.badge-conservada{background:var(--conservada-bg);border:1px solid var(--conservada-border);color:var(--conservada);box-shadow:0 0 8px rgba(255,202,40,.12)}
.badge-referencia{background:var(--referencia-bg);border:1px solid var(--referencia-border);color:var(--referencia)}
.tap-hint{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;transition:color 0.2s}
.coin-card:hover .tap-hint{color:var(--gold-dim)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.3s ease}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:18px;max-width:680px;width:100%;max-height:92vh;overflow-y:auto;position:relative;transform:translateY(30px) scale(0.96);transition:transform 0.35s cubic-bezier(0.2,0.9,0.4,1.1);box-shadow:0 0 100px rgba(0,0,0,.9),0 0 0 1px var(--border)}
.overlay.open .modal{transform:translateY(0) scale(1)}

.modal-hdr{padding:28px 30px 22px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--bg3),var(--bg2));position:relative}
.modal-close{position:absolute;top:20px;right:22px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:all 0.25s ease}
.modal-close:hover{color:var(--cream);border-color:var(--gold-dim);box-shadow:0 0 12px rgba(212,169,48,.2);transform:rotate(90deg)}
.modal-serie-tag{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold-dim);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
.modal-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--gold2);line-height:1.2;margin-bottom:6px;text-shadow:0 0 30px rgba(240,204,96,.3)}
.modal-sub{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}

/* Ornamento decorativo en modal (reemplaza la moneda) */
.modal-ornament{display:flex;justify-content:center;align-items:center;padding:18px 0 6px;gap:14px}
.orn-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim));max-width:80px}
.orn-line.r{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.orn-symbol{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold-dim);opacity:.7;letter-spacing:.15em}

.modal-body{padding:24px 30px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.mfield{padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;transition:all 0.2s}
.mfield:hover{border-color:var(--gold-dim)}
.mf-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.mf-val{font-family:'Playfair Display',serif;font-size:17px;color:var(--cream);font-weight:600}
.msec{margin-bottom:24px}
.msec-ttl{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold-dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.msec-ttl::after{content:'';flex:1;height:1px;background:var(--border)}
.msec-body{font-size:16.5px;color:var(--text);line-height:1.78}
.facts-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fchip{padding:5px 12px;border-radius:30px;font-family:'DM Mono',monospace;font-size:11px;background:var(--bg4);border:1px solid var(--border2);color:var(--text2);letter-spacing:.07em;text-transform:uppercase;transition:all 0.2s}
.fchip.gold{border-color:var(--gold-dim);color:var(--gold)}
.fchip:hover{transform:translateY(-2px);background:var(--bg3);box-shadow:0 4px 12px rgba(0,0,0,.4)}

/* modal estado */
.m-estado-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.m-ebtn{padding:13px 8px;border:1px solid var(--border2);border-radius:10px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;text-align:center;background:var(--bg3);color:var(--text2);transition:all 0.22s ease}
.m-ebtn .meicon{font-size:20px;display:block;margin-bottom:4px}
.m-ebtn .melbl{display:block;margin-bottom:2px}
.m-ebtn .medesc{font-size:9px;color:var(--text3);display:block;letter-spacing:.04em}
.m-ebtn:hover{color:var(--cream);transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.m-ebtn.on-nueva{background:var(--nueva-bg);border-color:var(--nueva);color:var(--nueva);box-shadow:0 0 16px var(--nueva-glow)}
.m-ebtn.on-seminueva{background:var(--seminueva-bg);border-color:var(--seminueva);color:var(--seminueva);box-shadow:0 0 16px var(--seminueva-glow)}
.m-ebtn.on-conservada{background:var(--conservada-bg);border-color:var(--conservada);color:var(--conservada);box-shadow:0 0 16px var(--conservada-glow)}
.m-ebtn.on-referencia{background:var(--referencia-bg);border-color:var(--referencia);color:var(--referencia)}

/* counters */
.qty-row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.qty-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;border:1px solid var(--border);transition:all 0.2s}
.qty-lbl{font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.qty-ctrls{display:flex;align-items:center;gap:8px}
.qty-btn{width:27px;height:27px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;opacity:.7;transition:opacity 0.15s, transform 0.1s, background 0.15s}
.qty-btn:hover{opacity:1;transform:scale(1.1);background:rgba(255,255,255,.08)}
.qty-btn:active{transform:scale(0.95)}
.qty-num{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;min-width:30px;text-align:center}

/* modal notes */
.modal-notes{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--cream);font-family:'Crimson Pro',serif;font-size:16.5px;font-style:italic;resize:none;outline:none;min-height:72px;transition:border-color 0.2s, box-shadow 0.2s;line-height:1.6;margin-top:10px}
.modal-notes:focus{border-color:var(--gold-dim);box-shadow:0 0 14px rgba(212,169,48,.12)}
.modal-notes::placeholder{color:var(--text3)}
.modal-footer{padding:16px 30px 24px;display:flex;justify-content:flex-end;border-top:1px solid var(--border);gap:10px}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;background:var(--bg3);border:1px solid var(--gold-dim);color:var(--gold2);padding:10px 20px;border-radius:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:0;transform:translateY(12px);transition:all 0.3s ease;pointer-events:none;z-index:9500;box-shadow:0 0 20px rgba(212,169,48,.18)}
.toast.show{opacity:1;transform:translateY(0)}

/* EMPTY STATE */
.empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);text-align:center}
.empty-state.show{display:flex}
.empty-state svg{margin-bottom:16px;opacity:.4}
.empty-state p{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase}

@media(max-width:768px){
  .header,.toolbar,.main{padding-left:16px;padding-right:16px}
  .header-inner{flex-direction:column}
  .coins-grid{grid-template-columns:1fr}
  .mgrid{grid-template-columns:1fr}
  .m-estado-grid{grid-template-columns:repeat(2,1fr)}
  .top-actions{flex-wrap:wrap}
  .filter-group{flex-wrap:wrap}
}

/* STAGGERED ENTRY */
.serie-block{animation:fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both}
.serie-block:nth-child(1){animation-delay:.04s}.serie-block:nth-child(2){animation-delay:.08s}
.serie-block:nth-child(3){animation-delay:.13s}.serie-block:nth-child(4){animation-delay:.18s}
.serie-block:nth-child(5){animation-delay:.23s}.serie-block:nth-child(6){animation-delay:.28s}
.serie-block:nth-child(7){animation-delay:.33s}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <!-- Ornamento SVG minimalista en vez de moneda -->
      <svg class="brand-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="none" stroke="#7a6020" stroke-width="1.2" stroke-dasharray="3 2.5"/>
        <circle cx="24" cy="24" r="18" fill="none" stroke="#d4a930" stroke-width="0.8"/>
        <circle cx="24" cy="24" r="14" fill="rgba(212,169,48,0.06)"/>

    {id:'r05',año:2011,nombre:'Monasterio de Santa Catalina',region:'Arequipa',

var TOTAL=SERIES.reduce(function(s,sr){return s+sr.monedas.length;},0);
var db={},currentFilter='all',currentSearch='',currentModalId=null;

function load(){try{var s=localStorage.getItem('numis_peru_v4');if(s)db=JSON.parse(s);}catch(e){}}
function save(){localStorage.setItem('numis_peru_v4',JSON.stringify(db));}
function getCoin(id){return db[id]||{nueva:0,seminueva:0,conservada:0,referencia:0,notas:''};}
function setNotas(id,v){var c=getCoin(id);c.notas=v;db[id]=c;save();}
function coinHasAny(id){var c=getCoin(id);return ED.reduce(function(s,e){return s+(c[e.key]||0);},0)>0;}
function coinPrimary(id){var c=getCoin(id);for(var i=0;i<ED.length;i++){if((c[ED[i].key]||0)>0)return ED[i].key;}return null;}

function qtyChange(id,estado,delta){
  event.stopPropagation();
  var c=getCoin(id);
  c[estado]=Math.max(0,(c[estado]||0)+delta);
  db[id]=c;save();
  refreshCard(id);updateStats();
  if(currentModalId===id)refreshModalCounters(id);
  showToast(delta>0?'+1 '+estado:'-1 '+estado);
}

function renderAll(){
  var ct=document.getElementById('mainContent');
  ct.innerHTML='';
  SERIES.forEach(function(sr,si){
    var div=document.createElement('div');
    div.className='serie-block';div.id='serie-'+sr.id;
    div.innerHTML=buildSerie(sr,si);
    ct.appendChild(div);
  });
  updateStats();applyFilter();
}

function buildSerie(sr){
  return '<div class="serie-hdr" onclick="toggleSerie(\''+sr.id+'\')">'+
    '<div class="serie-num">Serie '+sr.num+'</div>'+
    '<div class="serie-info">'+
      '<div class="serie-name">'+sr.nombre+'</div>'+
      '<div class="serie-meta">'+
        '<span>'+sr.periodo+'</span><span class="hl">'+sr.monedas.length+' monedas</span>'+
        '<span class="note">'+sr.nota+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="mini-prog">'+
      '<div class="mini-bar"><div class="mini-fill" id="mf-'+sr.id+'" style="width:0%"></div></div>'+
      '<span class="mini-pct" id="mp-'+sr.id+'">0%</span>'+
    '</div>'+
    '<div class="stoggle">▾</div>'+
  '</div>'+
  '<div class="coins-grid">'+sr.monedas.map(function(m,mi){return buildCoin(m,sr,mi);}).join('')+'</div>';
}

function buildCoin(m,sr,mi){
  var p=coinPrimary(m.id);
  return '<div class="coin-card'+(p?' has-'+p:'')+'" id="card-'+m.id+'" onclick="openModal(\''+m.id+'\')">'+coinInner(m,sr,mi)+'</div>';
}

function coinInner(m,sr,mi){
  var c=getCoin(m.id);
  var badges=ED.map(function(e){var n=c[e.key]||0;return n?'<span class="cbadge badge-'+e.key+'"><span class="bdot"></span>'+e.label+'<span class="bcount">'+n+'</span></span>':'';}).join('');
  return '<div class="coin-idx">'+sr.id.toUpperCase()+' · #'+('0'+(mi+1)).slice(-2)+'</div>'+
    '<div class="coin-year">'+m.año+' · '+m.region+'</div>'+
    '<div class="coin-name">'+m.nombre+'</div>'+
    '<div class="coin-blurb">'+m.historia.slice(0,100)+'…</div>'+
    '<div class="badges-strip" id="bs-'+m.id+'">'+badges+'</div>'+
    '<div class="tap-hint">Toca para ver detalles →</div>';
}

function refreshCard(id){
  var found=null,sr=null;
  for(var i=0;i<SERIES.length;i++){var m=SERIES[i].monedas.filter(function(x){return x.id===id;})[0];if(m){found=m;sr=SERIES[i];break;}}
  if(!found)return;
  var mi=sr.monedas.indexOf(found);
  var card=document.getElementById('card-'+id);
  if(!card)return;
  var p=coinPrimary(id);
  card.className='coin-card'+(p?' has-'+p:'');
  card.innerHTML=coinInner(found,sr,mi);
  card.onclick=function(){openModal(id);};
}

function updateStats(){
  var tots={nueva:0,seminueva:0,conservada:0,referencia:0};
  SERIES.forEach(function(sr){sr.monedas.forEach(function(m){var c=getCoin(m.id);ED.forEach(function(e){tots[e.key]+=(c[e.key]||0);});});});

  var cols={nueva:'var(--nueva)',seminueva:'var(--seminueva)',conservada:'var(--conservada)',referencia:'var(--referencia)'};
  var lbls={nueva:'Nuevas',seminueva:'Seminuevas',conservada:'Conservadas',referencia:'Referencia'};
  var totalUnidades=ED.reduce(function(s,e){return s+tots[e.key];},0);
  var reg=0;SERIES.forEach(function(sr){sr.monedas.forEach(function(m){if(coinHasAny(m.id))reg++;});});

  document.getElementById('statsRow').innerHTML=
    ED.map(function(e){
      var n=tots[e.key];var hasItems=n>0;
      var dotStyle=hasItems?'background:'+cols[e.key]+';box-shadow:0 0 6px '+cols[e.key]+'66':'background:var(--border2)';
      var countStyle=hasItems?'color:'+cols[e.key]:'color:var(--text3)';
      return '<div class="stat-pill">'+
        '<div class="sdot" style="'+dotStyle+'"></div>'+
        '<span class="slabel">'+lbls[e.key]+'</span>'+
        '<span class="scount'+(hasItems?' has-items':'')+'" style="'+countStyle+'">'+n+'</span>'+
        '<span class="sof">uds.</span>'+
      '</div>';
    }).join('')+
    '<div class="stat-pill total-pill">'+
      '<div class="sdot" style="background:var(--gold-dim)"></div>'+
      '<span class="slabel">Total</span>'+
      '<span class="scount has-items" style="color:var(--gold2)">'+totalUnidades+'</span>'+
      '<span class="sof">uds.</span>'+
    '</div>';

  var pct=Math.round(reg/TOTAL*100);
  document.getElementById('progLabel').textContent=reg+' / '+TOTAL+' registradas';
  document.getElementById('progFill').style.width=pct+'%';

  SERIES.forEach(function(sr){
    var r=0;sr.monedas.forEach(function(m){if(coinHasAny(m.id))r++;});
    var p=Math.round(r/sr.monedas.length*100);
    var mf=document.getElementById('mf-'+sr.id);var mp=document.getElementById('mp-'+sr.id);
    if(mf)mf.style.width=p+'%';if(mp)mp.textContent=p+'%';
  });
}

function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');applyFilter();}
function onSearch(){currentSearch=document.getElementById('searchInput').value.toLowerCase();applyFilter();}
function clearSearch(){document.getElementById('searchInput').value='';currentSearch='';applyFilter();}

function applyFilter(){
  SERIES.forEach(function(sr){
    var any=false;
    sr.monedas.forEach(function(m){
      var card=document.getElementById('card-'+m.id);if(!card)return;
      var c=getCoin(m.id);
      var fm=(currentFilter==='all')||((c[currentFilter]||0)>0);
      var sm=true;
      if(currentSearch){var txt=(m.nombre+m.historia+m.region+sr.nombre).toLowerCase();sm=txt.indexOf(currentSearch)>=0;}
      var vis=fm&&sm;card.style.display=vis?'':'none';if(vis)any=true;
    });
    var b=document.getElementById('serie-'+sr.id);
    if(b){b.classList[any?'remove':'add']('hidden');}
  });
}

function toggleSerie(id){document.getElementById('serie-'+id).classList.toggle('collapsed');}
function expandAll(){document.querySelectorAll('.serie-block').forEach(function(b){b.classList.remove('collapsed');});}
function collapseAll(){document.querySelectorAll('.serie-block').forEach(function(b){b.classList.add('collapsed');});}

function openModal(id){
  var found=null,sr=null;
  for(var i=0;i<SERIES.length;i++){var m=SERIES[i].monedas.filter(function(x){return x.id===id;})[0];if(m){found=m;sr=SERIES[i];break;}}
  if(!found)return;
  currentModalId=id;
  document.getElementById('mSerieTag').textContent='Serie '+sr.num+' · '+sr.nombre;
  document.getElementById('mTitle').textContent=found.nombre;
  document.getElementById('mSub').textContent=found.año+' · '+found.region;
  document.getElementById('mGrid').innerHTML=
    '<div class="mfield"><div class="mf-lbl">Año de emisión</div><div class="mf-val">'+found.año+'</div></div>'+
    '<div class="mfield"><div class="mf-lbl">Región</div><div class="mf-val">'+found.region+'</div></div>'+
    '<div class="mfield"><div class="mf-lbl">Denominación</div><div class="mf-val">S/ 1.00</div></div>'+
    '<div class="mfield"><div class="mf-lbl">Metal</div><div class="mf-val">Alpaca</div></div>'+
    '<div class="mfield"><div class="mf-lbl">Peso</div><div class="mf-val">7.32 g</div></div>'+
    '<div class="mfield"><div class="mf-lbl">Diámetro</div><div class="mf-val">25.5 mm</div></div>';
  document.getElementById('mHistoria').textContent=found.historia;
  document.getElementById('mFacts').innerHTML=(found.facts||[]).map(function(f){
    return '<span class="fchip'+(f.indexOf('🏆')>=0?' gold':'')+'">'+f+'</span>';
  }).join('');
  document.getElementById('mDiseno').textContent=found.diseno;
  refreshModalEstado(id);
  var ta=document.getElementById('mNotes');
  ta.value=getCoin(id).notas||'';ta.oninput=function(){setNotas(id,ta.value);};
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function refreshModalEstado(id){
  var c=getCoin(id);
  document.getElementById('mEstadoGrid').innerHTML=ED.map(function(e){
    return '<div class="m-ebtn '+((c[e.key]||0)>0?'on-'+e.key:'')+'" onclick="toggleEstadoActive(\''+id+'\',\''+e.key+'\')">'+
      '<span class="meicon">'+e.icon+'</span>'+
      '<span class="melbl">'+e.label+'</span>'+
      '<span class="medesc">'+e.desc+'</span>'+
    '</div>';
  }).join('');
  refreshModalCounters(id);
}

function toggleEstadoActive(id,estado){
  var c=getCoin(id);
  if((c[estado]||0)===0){c[estado]=1;}
  db[id]=c;save();
  refreshModalEstado(id);refreshCard(id);updateStats();
}

function refreshModalCounters(id){
  var c=getCoin(id);
  var active=ED.filter(function(e){return (c[e.key]||0)>0;});
  var cols={nueva:'var(--nueva)',seminueva:'var(--seminueva)',conservada:'var(--conservada)',referencia:'var(--referencia)'};
  document.getElementById('mQtyRow').innerHTML=active.length===0
    ?'<span style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--text3)">Selecciona un estado arriba para empezar</span>'
    :active.map(function(e){
      return '<div class="qty-item" style="border-color:'+cols[e.key]+'30;color:'+cols[e.key]+'">'+
        '<span class="qty-lbl">'+e.label+'</span>'+
        '<div class="qty-ctrls">'+
          '<button class="qty-btn" onclick="qtyChange(\''+id+'\',\''+e.key+'\',-1)">−</button>'+
          '<span class="qty-num" id="qn-'+id+'-'+e.key+'">'+( c[e.key]||0)+'</span>'+
          '<button class="qty-btn" onclick="qtyChange(\''+id+'\',\''+e.key+'\',+1)">+</button>'+
        '</div>'+
      '</div>';
    }).join('');
}

function closeModal(e){if(e.target===document.getElementById('overlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';currentModalId=null;}

function exportData(){
  var rows=[['Serie','Año','Moneda','Región','Nuevas','Seminuevas','Conservadas','Referencia','Total','Notas']];
  SERIES.forEach(function(sr){sr.monedas.forEach(function(m){
    var c=getCoin(m.id);
    var tot=(c.nueva||0)+(c.seminueva||0)+(c.conservada||0)+(c.referencia||0);
    rows.push([sr.nombre,m.año,m.nombre,m.region,c.nueva||0,c.seminueva||0,c.conservada||0,c.referencia||0,tot,(c.notas||'').replace(/\n/g,' ')]);
  });});
  var csv=rows.map(function(r){return r.map(function(x){return '"'+x+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download='coleccion_numismatica_peru.csv';a.click();
  showToast('CSV exportado ✓');
}

var _tt;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},2000);
}

load();renderAll();
</script>
</body>
</html>
